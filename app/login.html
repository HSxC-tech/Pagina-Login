<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <section id="container">
        <div class="IDs">
            <p>Teste</p>
            <p>teste@gmail.com</p>
            <p>teste@123</p>
        </div>
    </section>
    
    <p id="msgSignup" class="mensagem" style="visibility: visible;" >Somente para teste</p>

    <menu id="menuside">
        <h3>Testar:</h4>
        <button type="submit" id="ResetBD">Reset banco de dados</button>
        <p>Entrar</p>
        <button type="submit" id="LoginEmailExistente"  > E-mail existente </button>
        <button type="submit" id="LoginEmailInexistente">E-mail inexistente</button>
        <button type="submit" id="LoginSenhaCerta"      >Senha certa</button>
        <button type="submit" id="LoginSenhaErrada"     >Senha errada</button>
        

        <p>Cadastrar:</p>
        <button type="submit" id="SignupEmailCadastrado" >email já cadastrado</button>
        <button type="submit" id="SignupEmailNaoCadastrado" >email não cadastrado</button>
        <button type="submit" id="SignupSenhaCompativeis" >Senhas compativeis</button>
        <button type="submit" id="SignupSenhaIncompativel" >Senhas incompátiveis</button>

        <p id="msgMenuside" class="mensagem" style=""> Teste </p>
    </menu>

    <section class="login-signup">

        <div class="login-box">
            <h3>Fazer login</h3>
            
            <form id="login">
                
                <h5>Digite o seu email</h5>
                <input id="email" type="email" placeholder="Digite o seu email">

                <h5>Digite a sua senha</h5>
                <input id="senha" type="password" é placeholder="Digite a sua senha">

                <p id="msgLogin" class="mensagem"></p>
                <button type="submit">Logar</button>
            </form>

        </div>

        <div class="signup-box">
            <h3>Cadastrar conta</h3>
            
            <form id="signup">
                <h5>Digite o seu nome</h5>
                <input id="nomeSignup" type="text" placeholder="Digite o seu nome">
                
                <h5>Digite o seu email</h5>
                <input id="emailSignup" type="email" placeholder="Digite o seu email">

                <h5>Digite a sua senha</h5>
                <input id="senhaSignup" type="password" é placeholder="Digite a sua senha">

                <h5>Repita a sua senha</h5>
                <input id="senhaRepeatSignup" type="password" é placeholder="Repita a sua senha">


                <p id="msgSignup" class="mensagem"></p>
                <button type="submit">Logar</button>
            </form>

            
        </div>
    </section>




    <script src="forms-actions.js"></script>
</body>
</html>
